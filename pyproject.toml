[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "brayton-cycle"
version = "0.1.0"
description = "Modular steady-flow Brayton gas-turbine cycle simulator (Assignment 07)"
readme = "PROJECT_BRIEF.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pandas>=2.0",
    "matplotlib>=3.7",
]

[project.optional-dependencies]
coolprop = ["CoolProp>=6.6"]
cantera = ["cantera>=3.0"]
dev = ["pytest>=7.4", "pytest-cov>=4.1"]

[project.scripts]
brayton = "brayton_cycle.cli:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["brayton_cycle*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "coolprop: requires the optional CoolProp backend",
    "cantera: requires the optional Cantera backend",
]
